name: build-installer

# Windows PyInstaller build for the EasyOCR edition.
# Produces a standalone installer with bundled model weights so that
# offline first-run works on any fresh machine.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin CPU torch wheel — CUDA runtimes balloon the installer
          # by ~2 GB and the app is aimed at general Windows users
          # without NVIDIA hardware.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt
          pip install pyinstaller>=6.6

      - name: Prefetch EasyOCR models
        run: python scripts/prefetch_easyocr_models.py

      - name: Build
        run: python build.py

      - name: Smoke-test installer (offline OCR)
        shell: pwsh
        run: |
          $installRoot = "dist/OCRStudio"
          if (-not (Test-Path "$installRoot/OCRStudio.exe")) {
              throw "OCRStudio.exe missing in $installRoot"
          }
          $models = Get-ChildItem -Recurse -Path $installRoot -Filter "*.pth"
          if ($models.Count -lt 2) {
              throw "EasyOCR model weights missing from installer (found $($models.Count), need 2)"
          }
          foreach ($required in @("craft_mlt_25k.pth", "cyrillic_g2.pth")) {
              $hit = $models | Where-Object { $_.Name -eq $required }
              if (-not $hit) {
                  throw "Required EasyOCR weight $required missing from installer"
              }
          }
          $lex = Get-ChildItem -Recurse -Path $installRoot -Filter "ru_lexicon.txt"
          if (-not $lex) {
              throw "ru_lexicon.txt missing from installer"
          }
          $profiles = Get-ChildItem -Recurse -Path $installRoot -Filter "*.json" `
              | Where-Object { $_.FullName -like "*profiles*" }
          if ($profiles.Count -lt 1) {
              throw "Bundled profile JSONs missing from installer"
          }
          Write-Host "Installer layout validated: $($models.Count) model files, lexicon + profiles bundled"
          Get-ChildItem -Recurse -Path $installRoot/resources | Select-Object Name,Length

      - name: Smoke-test engine availability (offline)
        shell: pwsh
        # Exercise the frozen OCRStudio.exe via its CLI ``--check-engine``
        # hook. This catches bundle-level wiring bugs (missing torch
        # submodule, broken easyocr import path, bad --add-data layout)
        # before the installer ships. Uses HOME=tmp to forbid network
        # model downloads and ensure we're serving from the bundle.
        run: |
          $env:HOME = (New-Item -ItemType Directory -Path "tmp-home").FullName
          & "dist/OCRStudio/OCRStudio.exe" --check-engine easyocr
          if ($LASTEXITCODE -ne 0) {
              throw "OCRStudio.exe --check-engine easyocr failed ($LASTEXITCODE)"
          }

      - name: Smoke-test real OCR on bundled EasyOCR
        shell: pwsh
        # Per CLAUDE.md: "CI-шаг не только собирается, но и запускается
        # на реальных данных". We render a tiny synthetic PDF and run
        # the full pipeline through the frozen exe to prove the bundle
        # actually works end-to-end on a fresh Windows runner.
        run: |
          python -c "import fitz; d=fitz.open(); p=d.new_page(width=612,height=792); p.insert_text((72,200),'HELLO OCR 2026',fontsize=48); rb=d.tobytes(); d.close(); s=fitz.open(); src=fitz.open(stream=rb,filetype='pdf'); pix=src[0].get_pixmap(dpi=200,alpha=False); np=s.new_page(width=src[0].rect.width,height=src[0].rect.height); np.insert_image(np.rect,stream=pix.tobytes('png')); s.save('smoke.pdf')"
          & "dist/OCRStudio/OCRStudio.exe" --cli -p universal_clean -o smoke_out.pdf smoke.pdf -vv
          if ($LASTEXITCODE -ne 0) {
              throw "OCRStudio.exe --cli failed ($LASTEXITCODE)"
          }
          if (-not (Test-Path "smoke_out.pdf")) {
              throw "Smoke CLI produced no output PDF"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: OCRStudio-windows
          path: dist/OCRStudio/
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OCRStudio/**
