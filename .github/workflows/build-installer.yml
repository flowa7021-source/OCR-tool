name: build-installer

# Windows PyInstaller build for the EasyOCR edition.
# Produces a standalone installer with bundled model weights so that
# offline first-run works on any fresh machine.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin CPU torch wheel — CUDA runtimes balloon the installer
          # by ~2 GB and the app is aimed at general Windows users
          # without NVIDIA hardware.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt
          pip install pyinstaller>=6.6

      - name: Prefetch EasyOCR models
        run: python scripts/prefetch_easyocr_models.py

      - name: Build
        run: python build.py

      - name: Smoke-test installer (offline OCR)
        shell: pwsh
        run: |
          $installRoot = "dist/OCRStudio"
          if (-not (Test-Path "$installRoot/OCRStudio.exe")) {
              throw "OCRStudio.exe missing in $installRoot"
          }
          $models = Get-ChildItem -Recurse -Path $installRoot -Filter "*.pth"
          if ($models.Count -lt 2) {
              throw "EasyOCR model weights missing from installer (found $($models.Count), need 2)"
          }
          Write-Host "Installer validated: $($models.Count) model files bundled"
          Get-ChildItem -Recurse -Path $installRoot/resources | Select-Object Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: OCRStudio-windows
          path: dist/OCRStudio/
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OCRStudio/**
