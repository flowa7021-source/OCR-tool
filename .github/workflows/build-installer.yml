name: Build Windows Installer

# Produces a fully self-contained Windows installer (.exe) from the current
# source tree and publishes it to GitHub:
#
#   1. Downloads and silently installs Tesseract 5.5.0 (UB Mannheim build).
#   2. Downloads tessdata_best for rus + eng + osd.
#   3. Generates a multi-size Windows .ico from the bundled app.svg.
#   4. Runs compileall + unit tests as a pre-build gate.
#   5. Runs PyInstaller --onedir to freeze the Python application.
#   6. Verifies that the bundled Tesseract / tessdata actually made it into
#      the frozen tree.
#   7. Compiles installer/setup.iss with Inno Setup 6.
#   8. Computes a SHA-256 checksum.
#   9. Uploads the installer + checksum as a workflow artifact (90 days).
#  10. Publishes a GitHub Release:
#        - for tag pushes (v*): a proper, non-prerelease Release.
#        - for push to main / the dev branch: a rolling `latest-dev`
#          prerelease that is replaced on every successful build.
#        - for workflow_dispatch with `publish=false`: no release is created.
#
# Triggers: push to main/dev, push of a v*-tag, pull_request (build only,
# no release), and manual workflow_dispatch.

on:
  push:
    branches:
      - main
      # Match every Claude-managed branch so hot-fix / feature branches
      # (e.g. claude/fix-file-recognition-hang-*) trigger an installer
      # build alongside the existing claude/ocr-app-development-* one.
      # Aligned with ci.yml which already uses `claude/**`.
      - "claude/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tesseract_version:
        description: "UB Mannheim Tesseract release tag"
        required: false
        default: "v5.5.0.20241111"
      installer_version:
        description: "Installer version override (falls back to tag / pyproject)"
        required: false
        default: ""
      publish:
        description: "Publish a GitHub Release (true/false). Ignored on tags."
        required: false
        default: "true"
  # Allow release.yml (and potentially other orchestrators) to reuse this
  # pipeline without duplicating 400 lines of build steps. Outputs the name
  # of the artifact so callers can download it directly.
  workflow_call:
    inputs:
      tesseract_version:
        required: false
        type: string
        default: "v5.5.0.20241111"
      installer_version:
        required: false
        type: string
        default: ""
    outputs:
      installer_artifact:
        description: "Name of the uploaded installer artifact"
        value: ${{ jobs.build.outputs.installer_artifact }}

concurrency:
  group: build-installer-${{ github.ref }}
  # Cancel in-progress builds for the same ref on new pushes, but let
  # tag builds run to completion — we don't want to lose a release artifact.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write  # needed to push a Release when applicable

jobs:
  build:
    name: Build installer (Windows x64)
    runs-on: windows-latest
    outputs:
      installer_artifact: OCRStudio-Installer-${{ steps.meta.outputs.version }}

    env:
      TESSERACT_TAG: ${{ inputs.tesseract_version || github.event.inputs.tesseract_version || 'v5.5.0.20241111' }}
      PYTHON_VERSION: "3.11"

    steps:
      # ------------------------------------------------------------------
      # Source + Python toolchain
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags/commits for version derivation

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Cache the pip download cache explicitly. ``setup-python``'s
      # built-in pip cache is keyed on ``requirements.txt`` only.
      # Caching ``%LOCALAPPDATA%\pip\Cache`` lets re-runs skip the
      # wheel downloads entirely — saves ~1 min per build.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', '.github/workflows/build-installer.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          # --prefer-binary: never build a wheel from an sdist if a
          # pre-built one exists. Saves multi-minute C-extension compiles
          # when a package briefly loses its wheel on PyPI.
          pip install --prefer-binary -r requirements.txt
          pip install --prefer-binary "pyinstaller>=6.6,<7" pytest pytest-mock pytest-qt Pillow cairosvg

      - name: Resolve installer version + release metadata
        id: meta
        shell: pwsh
        run: |
          $override = "${{ github.event.inputs.installer_version }}".Trim()
          if ($override) {
            $version = $override.TrimStart('v')
            $kind = "manual"
          } elseif ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".StartsWith("v")) {
            $version = "${{ github.ref_name }}".Substring(1)
            $kind = "tag"
          } else {
            $pyver = (python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $version = "$pyver-dev.$shortSha"
            $kind = "dev"
          }
          Write-Host "Installer version: $version (kind=$kind)"
          "version=$version"  | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          "kind=$kind"        | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8

      # ------------------------------------------------------------------
      # Pre-build gate: lint + tests (fast, before the slow binary work)
      # ------------------------------------------------------------------
      - name: Run compileall + unit tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q src tests build.py dev_run.py
          pytest tests/unit -q --tb=short

      # ------------------------------------------------------------------
      # Tesseract 5.5.0 + tessdata_best
      # ------------------------------------------------------------------
      - name: Resolve Tesseract download URL via GitHub API
        id: tess-url
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # UB Mannheim tags their releases inconsistently (some with `v`
          # prefix, some without). Using the GitHub API saves us from guessing
          # the URL and gracefully falls back to the latest release if the
          # requested tag doesn't exist.
          $wanted = "${{ env.TESSERACT_TAG }}"
          $headers = @{ "User-Agent" = "ocr-studio-ci" }
          if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $env:GH_TOKEN" }

          function Invoke-GhApi($uri) {
            $tries = 0
            while ($true) {
              try {
                return Invoke-RestMethod -Uri $uri -Headers $headers -UseBasicParsing
              } catch {
                $tries++
                if ($tries -ge 4) { throw }
                Write-Warning "API call failed (attempt $tries): $($_.Exception.Message)"
                Start-Sleep -Seconds (2 * $tries)
              }
            }
          }

          $release = $null
          if ($wanted) {
            $candidates = @($wanted, $wanted.TrimStart('v'), "v$($wanted.TrimStart('v'))") | Select-Object -Unique
            foreach ($tag in $candidates) {
              try {
                $release = Invoke-GhApi "https://api.github.com/repos/UB-Mannheim/tesseract/releases/tags/$tag"
                Write-Host "Matched release by tag: $($release.tag_name)"
                break
              } catch {
                Write-Host "Tag '$tag' not found, trying next candidate..."
              }
            }
          }

          if (-not $release) {
            Write-Host "Falling back to the latest UB Mannheim release"
            # /releases/latest skips prereleases; /releases returns all in order.
            try {
              $release = Invoke-GhApi "https://api.github.com/repos/UB-Mannheim/tesseract/releases/latest"
            } catch {
              $list = Invoke-GhApi "https://api.github.com/repos/UB-Mannheim/tesseract/releases?per_page=10"
              $release = $list | Select-Object -First 1
            }
          }

          $asset = $release.assets | Where-Object {
            $_.name -like "tesseract-ocr-w64-setup-*.exe"
          } | Select-Object -First 1
          if (-not $asset) {
            throw "No Windows installer asset found in release '$($release.tag_name)'"
          }

          Write-Host "Release: $($release.tag_name)"
          Write-Host "Asset:   $($asset.name)  ($([math]::Round($asset.size / 1MB, 1)) MB)"
          Write-Host "URL:     $($asset.browser_download_url)"

          "tag=$($release.tag_name)"        | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_name=$($asset.name)"       | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          "download_url=$($asset.browser_download_url)" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache Tesseract installer
        id: cache-tess
        uses: actions/cache@v4
        with:
          path: tesseract_dl\tesseract-setup.exe
          key: tesseract-installer-${{ steps.tess-url.outputs.asset_name }}

      - name: Download Tesseract (UB Mannheim)
        if: steps.cache-tess.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "${{ steps.tess-url.outputs.download_url }}"
          Write-Host "Downloading $url"
          New-Item -ItemType Directory -Force -Path tesseract_dl | Out-Null
          $tries = 0
          while ($tries -lt 4) {
            try {
              Invoke-WebRequest -Uri $url -OutFile tesseract_dl\tesseract-setup.exe -UseBasicParsing
              break
            } catch {
              $tries++
              if ($tries -ge 4) { throw }
              Write-Warning "Download attempt $tries failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (2 * $tries)
            }
          }
          $file = Get-Item tesseract_dl\tesseract-setup.exe
          if ($file.Length -lt 10MB) {
            Remove-Item $file.FullName -Force
            throw "Downloaded file is suspiciously small ($($file.Length) bytes) — probably a GitHub 404 page"
          }
          Write-Host "Downloaded $([math]::Round($file.Length / 1MB, 1)) MB"

      - name: Extract Tesseract via 7-Zip (no installer run)
        # Inno Setup installers — including UB Mannheim's Tesseract build —
        # are recognised by modern 7-Zip as a compound archive. Extracting
        # them directly is 5-10× faster than the silent installer and, more
        # importantly, CANNOT hang: there is no UAC prompt, no UI, no
        # antivirus "smart screen" pause, and no post-install hook. This is
        # the primary install path. If extraction fails for any reason we
        # fall back to a watchdog-guarded silent install below.
        id: tess-extract
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = "Stop"
          $installerPath = Resolve-Path "tesseract_dl\tesseract-setup.exe"
          $extractDir   = "${{ github.workspace }}\tesseract_extract"
          $dest         = "${{ github.workspace }}\tesseract_install"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $sevenZip = $null
          foreach ($candidate in @(
            "C:\Program Files\7-Zip\7z.exe",
            "C:\Program Files (x86)\7-Zip\7z.exe",
            (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          )) {
            if ($candidate -and (Test-Path $candidate)) { $sevenZip = $candidate; break }
          }
          if (-not $sevenZip) { throw "7-Zip not found on runner" }
          Write-Host "Using 7-Zip at: $sevenZip"

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          # -y answers 'yes' to prompts; -o sets output dir; -bso0 -bsp0 quiet
          & $sevenZip x $installerPath.Path "-o$extractDir" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip extraction failed with exit code $LASTEXITCODE"
          }
          $sw.Stop()
          Write-Host ("7-Zip extraction completed in {0:N1}s" -f $sw.Elapsed.TotalSeconds)

          # Find tesseract.exe — it can land under {app}\, app\, or straight
          # at the root depending on 7-Zip version's handling of Inno Setup.
          $tessExe = Get-ChildItem -Path $extractDir -Filter "tesseract.exe" -Recurse -File |
                     Select-Object -First 1
          if (-not $tessExe) {
            throw "tesseract.exe not found under $extractDir after 7-Zip extraction"
          }
          $tessRoot = $tessExe.Directory.FullName
          Write-Host "Tesseract root: $tessRoot"

          # Mirror exe + every DLL into $dest, flattening to a single directory.
          Get-ChildItem -Path $tessRoot -File -Recurse |
            Where-Object { $_.Extension -in @('.exe', '.dll') -and $_.Name -notlike 'unins*' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination (Join-Path $dest $_.Name) -Force
            }

          if (-not (Test-Path "$dest\tesseract.exe")) {
            throw "tesseract.exe missing after copy to $dest"
          }

          # Smoke test. Some 7-Zip extractions drop required DLLs outside
          # the app\ folder; running --version exposes those problems here
          # rather than at PyInstaller or end-user time.
          try {
            & "$dest\tesseract.exe" --version
          } catch {
            Write-Warning "tesseract.exe --version failed: $($_.Exception.Message)"
            Write-Warning "Falling back to silent installer..."
            "needs_installer_fallback=true" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Fallback — silent install (watchdog-guarded)
        if: steps.tess-extract.outputs.needs_installer_fallback == 'true'
        shell: pwsh
        timeout-minutes: 8
        run: |
          $dest = "${{ github.workspace }}\tesseract_install"
          Remove-Item -Path $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $installerPath = "tesseract_dl\tesseract-setup.exe"
          $stdout = Join-Path $Env:RUNNER_TEMP "tesseract-install.out.log"
          $stderr = Join-Path $Env:RUNNER_TEMP "tesseract-install.err.log"

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath $installerPath `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$dest", "/LOG=$stdout" `
              -RedirectStandardError $stderr `
              -PassThru

          if (-not $proc.WaitForExit(5 * 60 * 1000)) {
            try { $proc.Kill() } catch {}
            if (Test-Path $stderr) { Write-Host "--- stderr ---"; Get-Content $stderr | Write-Host }
            if (Test-Path $stdout) { Write-Host "--- installer log ---"; Get-Content $stdout | Select-Object -Last 50 | Write-Host }
            throw "Tesseract silent install exceeded 5-minute watchdog"
          }

          $sw.Stop()
          Write-Host ("Installer exited in {0:N1}s with code {1}" -f $sw.Elapsed.TotalSeconds, $proc.ExitCode)
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $stderr) { Write-Host "--- stderr ---"; Get-Content $stderr | Write-Host }
            if (Test-Path $stdout) { Write-Host "--- installer log ---"; Get-Content $stdout | Select-Object -Last 50 | Write-Host }
            throw "Tesseract installer exited with non-zero code $($proc.ExitCode)"
          }
          if (-not (Test-Path "$dest\tesseract.exe")) {
            throw "Tesseract install reported success but $dest\tesseract.exe is missing"
          }
          & "$dest\tesseract.exe" --version

      - name: Copy Tesseract runtime into resources/tesseract
        shell: pwsh
        run: |
          $src = "${{ github.workspace }}\tesseract_install"
          $dst = "${{ github.workspace }}\resources\tesseract"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem -Path $src -File -Recurse |
            Where-Object {
              $_.Extension -in @('.exe', '.dll') -and
              $_.Name -notlike 'unins*'
            } |
            ForEach-Object {
              $rel = $_.FullName.Substring($src.Length).TrimStart('\')
              $target = Join-Path $dst $rel
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              Copy-Item $_.FullName -Destination $target -Force
            }
          Write-Host "Tesseract bundle:"
          Get-ChildItem $dst -Recurse | Select-Object FullName, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Cache tessdata
        id: cache-tessdata
        uses: actions/cache@v4
        with:
          path: resources\tessdata
          key: tessdata-best-rus-eng-osd-configs-v3

      - name: Download tessdata_best (rus, eng, osd)
        if: steps.cache-tessdata.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dst = "${{ github.workspace }}\resources\tessdata"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          # Try the raw GitHub URL first; if that somehow 404s, fall back to
          # the `media` endpoint on the API which is stable across repo moves.
          $mirrors = @(
            "https://github.com/tesseract-ocr/tessdata_best/raw/main",
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main"
          )

          foreach ($lang in @("rus", "eng", "osd")) {
            $out = Join-Path $dst "$lang.traineddata"
            $success = $false
            foreach ($base in $mirrors) {
              $url = "$base/$lang.traineddata"
              Write-Host "Downloading $url"
              $tries = 0
              while ($tries -lt 3) {
                try {
                  Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
                  $size = (Get-Item $out).Length
                  if ($size -lt 1000000) {
                    Write-Warning "Downloaded $lang.traineddata is too small ($size bytes); trying next mirror"
                    Remove-Item $out -Force -ErrorAction SilentlyContinue
                    break
                  }
                  $success = $true
                  break
                } catch {
                  $tries++
                  Write-Warning "Attempt $tries for $lang from $base failed: $($_.Exception.Message)"
                  if ($tries -ge 3) { break }
                  Start-Sleep -Seconds (2 * $tries)
                }
              }
              if ($success) { break }
            }
            if (-not $success) {
              throw "Failed to download $lang.traineddata from any mirror"
            }
          }
          Get-ChildItem $dst | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      # ------------------------------------------------------------------
      # tessdata/configs/ — Tesseract's output-format config files.
      # These tiny text files (a few bytes each) tell Tesseract WHICH
      # output formats to produce: ``hocr`` flips ``tessedit_create_hocr``,
      # ``txt`` flips ``tessedit_create_txt``, etc. Without them
      # OCRmyPDF cannot ask Tesseract to emit hOCR — Tesseract logs
      # ``read_params_file: Can't open hocr`` and writes nothing, then
      # OCRmyPDF crashes in graft with ``FileNotFoundError`` because
      # the per-page hOCR file it stat()s never got created.
      #
      # The configs ship in the main ``tesseract`` source repo, NOT in
      # ``tessdata_best`` (which only has language models). We download
      # the canonical set from upstream so every installer carries them.
      # ------------------------------------------------------------------
      - name: Download tessdata/configs (output-format configs)
        if: steps.cache-tessdata.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $configsDst = "${{ github.workspace }}\resources\tessdata\configs"
          New-Item -ItemType Directory -Force -Path $configsDst | Out-Null

          # Canonical config files from tesseract-ocr/tesseract main:
          #   https://github.com/tesseract-ocr/tesseract/tree/main/tessdata/configs
          # Listed explicitly so a future upstream addition doesn't
          # silently change the bundle behaviour. ``hocr``, ``txt`` and
          # ``pdf`` are the ones OCRmyPDF actually uses; the rest are
          # included for parity with a standard Tesseract install so
          # users running the bundled binary directly aren't surprised.
          $configs = @(
            "alto", "ambigs.train", "api_config", "bazaar", "bigram",
            "box.train", "box.train.stderr", "digits", "get.images",
            "hocr", "inter", "kannada", "linebox", "logfile",
            "lstm.train", "lstmbox", "lstmdebug", "makebox", "pdf",
            "quiet", "rebox", "strokewidth", "tsv", "txt", "unlv",
            "wordstrbox"
          )

          $mirrors = @(
            "https://github.com/tesseract-ocr/tesseract/raw/main/tessdata/configs",
            "https://raw.githubusercontent.com/tesseract-ocr/tesseract/main/tessdata/configs"
          )

          foreach ($cfg in $configs) {
            $out = Join-Path $configsDst $cfg
            $success = $false
            foreach ($base in $mirrors) {
              $url = "$base/$cfg"
              try {
                Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
                $success = $true
                break
              } catch {
                Write-Warning "Config $cfg from $base failed: $($_.Exception.Message)"
              }
            }
            if (-not $success) {
              throw "Failed to download tessdata config '$cfg' from any mirror"
            }
          }

          # Sanity: hocr, txt, pdf MUST be present — those are the
          # ones OCRmyPDF actually reads. If any is missing, OCR fails
          # silently at runtime with the dreaded graft-hocr-miss error.
          foreach ($required in @("hocr", "txt", "pdf")) {
            $p = Join-Path $configsDst $required
            if (-not (Test-Path $p)) {
              throw "Required tessdata config '$required' missing after download"
            }
          }
          Write-Host "tessdata/configs/ ready:"
          Get-ChildItem $configsDst | Select-Object Name, Length

      # ------------------------------------------------------------------
      # Ghostscript — HARD runtime dependency of OCRmyPDF
      # ------------------------------------------------------------------
      # OCRmyPDF calls ``gs``/``gswin64c.exe`` via shutil.which() to merge
      # the OCR text layer onto the PDF and to produce PDF/A output. It
      # is NOT optional — even with clean/deskew/remove_background
      # disabled, the merge step still goes through Ghostscript. Without
      # a bundled copy the user sees ``MissingDependencyError: Could not
      # find program 'gs'`` at the first OCR attempt.
      #
      # We pull the portable zip from the official Artifex releases and
      # lift just the console executable + the shared DLL into
      # ``resources/ghostscript/``. That's all OCRmyPDF needs; the full
      # distribution (lib/, iccprofiles/, Resource/) would nearly double
      # the bundle for features we don't use.
      - name: Cache Ghostscript portable
        id: cache-gs
        uses: actions/cache@v4
        with:
          path: ghostscript_dl
          key: ghostscript-portable-10.04.0-win64-v1

      - name: Download Ghostscript portable (Artifex)
        if: steps.cache-gs.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 8
        run: |
          # Artifex ships self-extracting installers, not clean zips.
          # Using the .exe + 7-Zip extraction (same pattern as Tesseract)
          # avoids needing admin rights to run the installer silently.
          $version = "10.04.0"
          $asset = "gs$($version -replace '\.','')w64.exe"
          $url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs$($version -replace '\.','')/$asset"
          New-Item -ItemType Directory -Force -Path ghostscript_dl | Out-Null
          Write-Host "Downloading $url"
          $tries = 0
          while ($tries -lt 4) {
            try {
              Invoke-WebRequest -Uri $url -OutFile "ghostscript_dl\$asset" -UseBasicParsing
              break
            } catch {
              $tries++
              if ($tries -ge 4) { throw }
              Write-Warning "Download attempt $tries failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (2 * $tries)
            }
          }
          $file = Get-Item "ghostscript_dl\$asset"
          if ($file.Length -lt 5MB) {
            throw "Ghostscript download is suspiciously small ($($file.Length) bytes)"
          }
          Write-Host "Downloaded Ghostscript: $([math]::Round($file.Length/1MB,1)) MB"

      - name: Extract Ghostscript + copy into resources/ghostscript
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem ghostscript_dl\*.exe | Select-Object -First 1
          if (-not $installer) { throw "Ghostscript installer not found" }

          $extractDir = "${{ github.workspace }}\ghostscript_extract"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          $sevenZip = $null
          foreach ($candidate in @(
            "C:\Program Files\7-Zip\7z.exe",
            "C:\Program Files (x86)\7-Zip\7z.exe",
            (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          )) {
            if ($candidate -and (Test-Path $candidate)) { $sevenZip = $candidate; break }
          }
          if (-not $sevenZip) { throw "7-Zip not found on runner" }

          & $sevenZip x $installer.FullName "-o$extractDir" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip extraction of Ghostscript failed (exit=$LASTEXITCODE)"
          }

          $dst = "${{ github.workspace }}\resources\ghostscript"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          # gswin64c.exe + gsdll64.dll alone are NOT enough. Ghostscript's
          # PostScript interpreter refuses to start without the runtime
          # libraries in ``lib/`` and the initialisation files in
          # ``Resource/Init/`` (specifically gs_init.ps). The previous
          # build skipped both subdirs to save ~30 MB — that worked
          # accidentally because OCRmyPDF only invokes Ghostscript at
          # the optimization step, and end-to-end OCR was hitting the
          # tessdata/configs bug long before reaching optimization.
          # With configs/ fixed, the Ghostscript-Resource gap becomes
          # the next visible failure mode (PDF would build but the
          # final ``optimize=LOSSLESS`` pass would crash with
          # "Can't find initialization file gs_init.ps").
          #
          # Bundling lib/ + Resource/ adds ~25 MB to the installer —
          # an acceptable tax for "OCR finishes without a cryptic
          # PostScript error".
          foreach ($wanted in @("gswin64c.exe", "gsdll64.dll")) {
            $hit = Get-ChildItem -Path $extractDir -Filter $wanted -Recurse -File |
                   Select-Object -First 1
            if (-not $hit) {
              throw "Ghostscript extraction missing expected file: $wanted"
            }
            Copy-Item $hit.FullName -Destination (Join-Path $dst $wanted) -Force
            Write-Host ("Copied {0} ({1:N1} MB)" -f $wanted, ($hit.Length/1MB))
          }

          # Locate the Ghostscript install root (parent of bin\, lib\, Resource\).
          $gsExe = Get-ChildItem -Path $extractDir -Filter "gswin64c.exe" -Recurse -File |
                   Select-Object -First 1
          if (-not $gsExe) { throw "gswin64c.exe missing after extraction" }
          # Resource/ and lib/ live at the same level as bin/ — go up
          # two levels from ``...\bin\gswin64c.exe`` to find them.
          $gsRoot = $gsExe.Directory.Parent.FullName
          Write-Host "Ghostscript root: $gsRoot"

          # Copy lib/ — the PostScript runtime (~3 MB)
          $libSrc = Join-Path $gsRoot "lib"
          if (Test-Path $libSrc) {
            Copy-Item -Path $libSrc -Destination (Join-Path $dst "lib") `
                      -Recurse -Force
            Write-Host "Copied Ghostscript lib/"
          } else {
            throw "Ghostscript lib/ subdirectory not found at $libSrc"
          }

          # Copy Resource/Init/ + Resource/Font/ + Resource/CMap/ +
          # Resource/ColorSpace/ + iccprofiles/. These are everything
          # Ghostscript's pdfwrite device needs to round-trip a PDF
          # through the optimization pipeline. We DON'T copy the full
          # Resource/ tree because Resource/CIDFont/ alone is ~15 MB
          # of CJK fonts our users don't need.
          $resSrc = Join-Path $gsRoot "Resource"
          $resDst = Join-Path $dst "Resource"
          New-Item -ItemType Directory -Force -Path $resDst | Out-Null
          foreach ($sub in @("Init", "Font", "CMap", "ColorSpace", "Decoding")) {
            $src = Join-Path $resSrc $sub
            if (Test-Path $src) {
              Copy-Item -Path $src `
                        -Destination (Join-Path $resDst $sub) `
                        -Recurse -Force
              Write-Host "Copied Resource/$sub"
            } else {
              Write-Warning "Resource/$sub not found — skipping"
            }
          }

          # iccprofiles/ for PDF/A and colour management (~2 MB)
          $iccSrc = Join-Path $gsRoot "iccprofiles"
          if (Test-Path $iccSrc) {
            Copy-Item -Path $iccSrc `
                      -Destination (Join-Path $dst "iccprofiles") `
                      -Recurse -Force
            Write-Host "Copied iccprofiles/"
          }

          # Sanity: Resource/Init/gs_init.ps MUST be present — it's
          # the one file Ghostscript stat()s to start the PostScript
          # interpreter. Without it every Ghostscript invocation
          # bails immediately.
          $gsInit = Join-Path $resDst "Init\gs_init.ps"
          if (-not (Test-Path $gsInit)) {
            throw "Ghostscript Resource/Init/gs_init.ps missing after copy"
          }

          $totalMB = [math]::Round(
            ((Get-ChildItem $dst -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB),
            1
          )
          Write-Host "Ghostscript bundle total: $totalMB MB"

          # Smoke test #1: --version (works without Resource/lib).
          & "$dst\gswin64c.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled gswin64c.exe --version failed (exit=$LASTEXITCODE)"
          }

          # Smoke test #2: actually interpret a tiny PostScript program.
          # This is the test that catches missing Resource/Init/gs_init.ps —
          # the previous --version-only check would pass even with a
          # broken Ghostscript bundle because --version short-circuits
          # the PostScript interpreter init. Building a one-page PDF
          # via pdfwrite forces the interpreter to load gs_init.ps,
          # the Resource/Font/ defaults, and an iccprofiles entry.
          #
          # The PostScript is passed inline via ``-c`` rather than a
          # heredoc — a heredoc would require ``%!PS`` at column 0,
          # which conflicts with YAML literal-block indentation rules
          # and breaks the workflow file.
          $smokeOut = Join-Path $env:RUNNER_TEMP "gs-smoke-out.pdf"
          & "$dst\gswin64c.exe" `
              -dBATCH -dNOPAUSE -dQUIET `
              -sDEVICE=pdfwrite `
              -o $smokeOut `
              -c "/Helvetica findfont 12 scalefont setfont 72 720 moveto (Ghostscript bundle smoke test) show showpage"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $smokeOut)) {
            throw "Bundled Ghostscript pdfwrite smoke test failed (exit=$LASTEXITCODE). Resource/Init/lib/ likely incomplete."
          }
          Write-Host "Ghostscript pdfwrite smoke test OK ($((Get-Item $smokeOut).Length) bytes)"
          Remove-Item $smokeOut -ErrorAction SilentlyContinue

          Get-ChildItem $dst | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      # ------------------------------------------------------------------
      # Windows .ico from SVG
      # ------------------------------------------------------------------
      - name: Generate app.ico from app.svg
        shell: pwsh
        continue-on-error: true
        # Must invoke the script as a file — PowerShell doesn't understand
        # bash heredoc `python - <<'EOF'`, it treats `<<` as a broken
        # redirection and aborts the whole step. See
        # .github/scripts/generate_ico.py for the real logic.
        run: python .github/scripts/generate_ico.py

      # ------------------------------------------------------------------
      # Freeze with PyInstaller
      # ------------------------------------------------------------------
      - name: Run PyInstaller (build.py)
        shell: pwsh
        timeout-minutes: 20
        run: python build.py

      - name: Verify frozen bundle
        shell: pwsh
        run: |
          $exe = "dist\OCRStudio\OCRStudio.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected frozen binary not found: $exe"
          }
          # PyInstaller 6.x --onedir bundles data under _internal\; fallback to top-level on older versions.
          $searchRoots = @("dist\OCRStudio\_internal", "dist\OCRStudio")

          function Find-InRoots($roots, $relPath) {
            foreach ($root in $roots) {
              if (Test-Path (Join-Path $root $relPath)) { return $true }
            }
            return $false
          }

          $tessOk = Find-InRoots $searchRoots "resources\tesseract\tesseract.exe"
          $dataOk = Find-InRoots $searchRoots "resources\tessdata\rus.traineddata"
          $gsOk   = Find-InRoots $searchRoots "resources\ghostscript\gswin64c.exe"
          if (-not $tessOk) { throw "Bundled Tesseract missing from PyInstaller output" }
          if (-not $dataOk) { throw "Bundled tessdata (rus) missing from PyInstaller output" }
          if (-not $gsOk) { throw "Bundled Ghostscript (gswin64c.exe) missing from PyInstaller output — OCRmyPDF would fail at first run" }

          $size = (Get-ChildItem dist\OCRStudio -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Frozen bundle size: {0:N0} bytes ({1:N1} MB)" -f $size, ($size/1MB))

      # ------------------------------------------------------------------
      # Inno Setup
      # ------------------------------------------------------------------
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install -y --no-progress innosetup
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found"
          }
          Write-Host "ISCC at: $iscc"
          "ISCC=$iscc" | Out-File -FilePath $Env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile installer
        shell: pwsh
        # LZMA2 ultra-compression on a 2.5 GB tree can take 10-20 min.
        timeout-minutes: 30
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path installer\Output | Out-Null
          & "$Env:ISCC" "/DMyAppVersion=$ver" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }
          Get-ChildItem installer\Output | Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} -AutoSize

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          if (-not $installer) { throw "No installer produced" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          $line = "$hash  $($installer.Name)"
          $line | Out-File -Encoding ascii "installer\Output\$($installer.BaseName).sha256"
          Write-Host "SHA-256: $line"

      - name: Sanity-check installer integrity
        # NOTE: Inno Setup's `/?` and `/HELP` open a GUI dialog even on
        # headless runners — they do NOT print to stdout and exit. Any
        # attempt to "ping" the installer with those flags will hang until
        # the step timeout. Instead we verify the file statically:
        #   1. Reasonable size (our bundle is ~150-300 MB).
        #   2. Valid PE executable (MZ + PE\0\0 header).
        #   3. 7-Zip can enumerate its internal archive — this proves Inno
        #      Setup wrote a correctly-formed container without actually
        #      running any code from it.
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          if (-not $installer) { throw "No installer produced" }
          $path = $installer.FullName
          $sizeMB = [math]::Round($installer.Length / 1MB, 1)
          Write-Host ("Installer: {0} ({1} MB)" -f $installer.Name, $sizeMB)

          # 1. Size sanity. Tesseract + tessdata + Python + Qt + Ghostscript
          #    should compress to ≥ 80 MB. A silent content drop
          #    (missing tessdata, missing Ghostscript, etc.) shrinks the
          #    installer well below this floor, so flag it here before
          #    any smoke test even starts.
          $minMB = 80
          if ($installer.Length -lt ($minMB * 1MB)) {
            throw "Installer is suspiciously small ($sizeMB MB, expected >= $minMB MB) — bundled assets likely missing"
          }

          # 2. PE header. Every valid Windows executable starts with "MZ"
          #    at offset 0 and "PE\0\0" at the offset stored in e_lfanew.
          $fs = [System.IO.File]::Open($path, 'Open', 'Read', 'Read')
          try {
            $br = New-Object System.IO.BinaryReader($fs)
            $mz = $br.ReadBytes(2)
            if ($mz[0] -ne 0x4D -or $mz[1] -ne 0x5A) {
              throw "File does not start with MZ — not a valid PE executable"
            }
            $fs.Seek(0x3C, [System.IO.SeekOrigin]::Begin) | Out-Null
            $peOffset = $br.ReadUInt32()
            $fs.Seek($peOffset, [System.IO.SeekOrigin]::Begin) | Out-Null
            $pe = $br.ReadBytes(4)
            if ($pe[0] -ne 0x50 -or $pe[1] -ne 0x45 -or $pe[2] -ne 0 -or $pe[3] -ne 0) {
              throw "PE signature not found at offset $peOffset — file corrupt"
            }
          } finally {
            $fs.Dispose()
          }
          Write-Host "PE header: OK"

          # 3. Inno Setup signature check. 7-Zip's support for Inno Setup
          #    archives is inconsistent — modern Inno Setup 6 containers
          #    often return "Cannot open the file as archive" even on
          #    perfectly valid .exe files (which can still be installed
          #    and uninstalled normally). So instead of parsing the
          #    archive, we just confirm the compiler's signature string
          #    is embedded. Every .exe produced by ISCC contains the
          #    literal "Inno Setup" plus a version fingerprint somewhere
          #    in its data section.
          #
          #    Streaming scan. ``ReadAllBytes`` + ``GetString`` used to
          #    work on smaller bundles but could OOM PowerShell on a
          #    larger one ("Exception of type
          #    'System.OutOfMemoryException' was thrown."). We now read
          #    4 MB chunks through a StreamReader with ASCII encoding
          #    and keep a trailing window so a match
          #    that straddles a chunk boundary is still found.
          $signature = "Inno Setup"
          $found = $false
          $context = $null
          $fs2 = [System.IO.File]::Open($path, 'Open', 'Read', 'Read')
          try {
            $sr = New-Object System.IO.StreamReader($fs2, [System.Text.Encoding]::ASCII)
            $bufferSize = 4 * 1024 * 1024   # 4 MB
            $buffer = New-Object char[] $bufferSize
            $tail = ""
            while (($read = $sr.Read($buffer, 0, $bufferSize)) -gt 0) {
              $chunk = $tail + [string]::new($buffer, 0, $read)
              $idx = $chunk.IndexOf($signature)
              if ($idx -ge 0) {
                $found = $true
                # Grab ~48 bytes of context after the hit for the
                # version-extraction regex below.
                $end = [Math]::Min($idx + $signature.Length + 48, $chunk.Length)
                $context = $chunk.Substring($idx, $end - $idx)
                break
              }
              # Keep trailing bytes so a signature straddling a chunk
              # boundary is still caught on the next iteration.
              if ($chunk.Length -gt $signature.Length) {
                $tail = $chunk.Substring($chunk.Length - $signature.Length)
              } else {
                $tail = $chunk
              }
            }
          } finally {
            if ($sr) { $sr.Dispose() }
            $fs2.Dispose()
          }
          if (-not $found) {
            throw "Installer does not contain the 'Inno Setup' signature — probably not a valid installer"
          }
          # Report the embedded version for easier diagnosis (from the
          # 48-byte context we captured around the signature hit).
          $m = [regex]::Match($context, "Inno Setup \(([^)]+)\)")
          if (-not $m.Success) {
            $m = [regex]::Match($context, "Inno Setup[^\x00]{0,40}")
          }
          if ($m.Success) {
            Write-Host "Inno Setup signature: $($m.Value)"
          } else {
            Write-Host "Inno Setup signature: found"
          }

          Write-Host "Installer integrity check passed"

      # ------------------------------------------------------------------
      # Install + smoke-test the actual produced installer
      # ------------------------------------------------------------------
      # Catches the entire class of "we built the installer but it
      # ships without file X" bugs — e.g. tessdata/configs/ (3-day
      # production blocker) and Ghostscript Resource/Init/ (next-bug
      # fix). The previous CI verified that the installer COMPILED;
      # this step verifies that an installed copy can actually OCR a
      # real PDF and produce a searchable result. If anything is
      # missing from the bundle, this step fails with a concrete
      # error message identifying the gap.
      - name: Smoke-test the installed product (full OCR round-trip)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          if (-not $installer) { throw "No installer to smoke-test" }

          # 1. Silent-install to a temp directory inside the workspace.
          # /SILENT (not /VERYSILENT) shows minimal progress in the log
          # so we can tell the installer didn't hang. /SP- skips the
          # initial "Welcome" prompt. /DIR forces a known install path.
          $installDir = "${{ github.workspace }}\smoke_install"
          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          $installLog = Join-Path $env:RUNNER_TEMP "installer-smoke.log"
          Write-Host "Running silent install to $installDir"
          $proc = Start-Process -FilePath $installer.FullName `
              -ArgumentList "/SILENT", "/SUPPRESSMSGBOXES", "/NORESTART", `
                            "/SP-", "/DIR=$installDir", "/LOG=$installLog" `
              -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $installLog) {
              Get-Content $installLog -Tail 50 | Write-Host
            }
            throw "Silent install exited with $($proc.ExitCode)"
          }
          Write-Host "Install OK. Contents:"
          Get-ChildItem $installDir | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

          # 2. Locate the CLI entry point. The installer ships a GUI
          # launcher (OCRStudio.exe) that also exposes the CLI when
          # invoked with arguments — same binary, argparse routes to
          # CLI mode. Tolerate both ``OCRStudio.exe`` at the install
          # root and inside an ``OCR Studio`` subdir.
          $cli = $null
          foreach ($candidate in @(
            (Join-Path $installDir "OCRStudio.exe"),
            (Join-Path $installDir "OCR Studio.exe")
          )) {
            if (Test-Path $candidate) { $cli = $candidate; break }
          }
          if (-not $cli) {
            $cli = Get-ChildItem -Path $installDir -Filter "*.exe" -Recurse -File |
                   Where-Object { $_.Name -notlike 'unins*' } |
                   Where-Object { $_.Name -notlike 'tesseract*' } |
                   Where-Object { $_.Name -notlike 'gs*' } |
                   Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cli) { throw "Could not locate the installed application binary" }
          Write-Host "Application binary: $cli"

          # 3. Build a tiny one-page test PDF that's guaranteed to
          # OCR cleanly: large Helvetica, plenty of contrast, English
          # so we don't depend on rus.traineddata being present.
          # Rasterise at 100 DPI to keep the test input small (~200 KB
          # instead of ~11 MB at 200 DPI) — we're testing that OCR
          # runs end-to-end, not accuracy, so the low DPI is fine.
          $smokeIn  = Join-Path $env:RUNNER_TEMP "smoke-input.pdf"
          $smokeOut = Join-Path $env:RUNNER_TEMP "smoke-output.pdf"
          $pyScript = Join-Path $env:RUNNER_TEMP "make-smoke.py"
          $pyContent = @(
            "import fitz",
            "doc = fitz.open()",
            "page = doc.new_page(width=612, height=792)",
            "page.insert_text((72, 200), 'SMOKE TEST OCR 2026', fontsize=48, fontname='helv')",
            "raw = doc.tobytes()",
            "doc.close()",
            "scan = fitz.open()",
            "src = fitz.open(stream=raw, filetype='pdf')",
            "for p in src:",
            "    pix = p.get_pixmap(dpi=100, alpha=False)",
            "    new = scan.new_page(width=p.rect.width, height=p.rect.height)",
            "    new.insert_image(new.rect, stream=pix.tobytes('png'))",
            "scan.save(r'$smokeIn')",
            "scan.close()",
            "src.close()",
            "print('wrote', r'$smokeIn')"
          )
          $pyContent | Set-Content -Path $pyScript -Encoding ascii
          python $pyScript
          if (-not (Test-Path $smokeIn)) {
            throw "Failed to render smoke-test input PDF"
          }
          Write-Host "Smoke input: $smokeIn ($((Get-Item $smokeIn).Length) bytes)"

          # 4. Run the installed binary in CLI mode on the test PDF.
          # The ``OCRStudio.exe`` binary is a PyInstaller --windowed
          # GUI build by default — argparse alone wouldn't route
          # correctly without the ``--cli`` sentinel that src/main.py
          # checks for before constructing QApplication. Without this
          # flag the installed EXE opens the GUI window, tries to
          # ``open`` the input PDF, and sits waiting for user input
          # until the workflow step times out.
          #
          # Uses ``universal_accurate`` — единственный builtin после
          # консолидации декабря 2026 (quick_reliable / default /
          # low_quality_scan и др. удалены; см. profile_manager).
          # На SMOKE-входе (1-page English text @ 100 DPI) даже
          # heavy-preprocessing профиль завершается за < 30 с.
          Write-Host "Running OCR via installed CLI..."
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath $cli `
              -ArgumentList @(
                "--cli",
                $smokeIn,
                "-o", $smokeOut,
                "--profile", "universal_accurate",
                "--workers", "1"
              ) `
              -NoNewWindow -PassThru -Wait `
              -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "smoke-stdout.log") `
              -RedirectStandardError  (Join-Path $env:RUNNER_TEMP "smoke-stderr.log")
          $sw.Stop()
          Write-Host ("OCR finished in {0:N1}s, exit code = {1}" -f $sw.Elapsed.TotalSeconds, $proc.ExitCode)
          Get-Content (Join-Path $env:RUNNER_TEMP "smoke-stdout.log") -Tail 40 | Write-Host
          Get-Content (Join-Path $env:RUNNER_TEMP "smoke-stderr.log") -Tail 40 | Write-Host

          if ($proc.ExitCode -ne 0) {
            throw "Installed CLI exited with code $($proc.ExitCode)"
          }
          if (-not (Test-Path $smokeOut)) {
            throw "Installed CLI did not produce an output PDF at $smokeOut"
          }

          # 5. Verify the output PDF actually has a text layer with
          # recognisable content. This is the critical assertion: any
          # missing tessdata/configs/, Ghostscript Resource/, OCRmyPDF
          # data file or other bundled-but-incomplete dependency
          # would surface here as either an empty text layer or a
          # crashed pipeline.
          $verifyScript = Join-Path $env:RUNNER_TEMP "verify-smoke.py"
          $verifyContent = @(
            "import fitz, sys",
            "doc = fitz.open(r'$smokeOut')",
            "all_text = ''",
            "for page in doc:",
            "    all_text += page.get_text('text') or ''",
            "doc.close()",
            "all_text = all_text.strip()",
            "if not all_text:",
            "    sys.exit('FAIL: output PDF has no text layer at all')",
            "print(f'OK: extracted {len(all_text)} characters')",
            "print(f'sample: {all_text[:200]!r}')",
            "# Tesseract should at least recognise SOME of the smoke string.",
            "if not any(tok in all_text.upper() for tok in ('SMOKE', 'TEST', 'OCR', '2026')):",
            "    sys.exit(f'FAIL: text layer present but recognised content unexpected: {all_text!r}')",
            "print('verification passed')"
          )
          $verifyContent | Set-Content -Path $verifyScript -Encoding ascii
          python $verifyScript
          if ($LASTEXITCODE -ne 0) {
            throw "Output PDF text-layer verification failed (exit=$LASTEXITCODE)"
          }

          Write-Host "Install + smoke-test PASSED"

      # ------------------------------------------------------------------
      # Parser smoke — runs the ТН / УПД extractor end-to-end through
      # the installed binary. Distinct from the OCR smoke above: this
      # one exercises the full pipeline with ``extract.enabled=True``
      # (via the ``tn_upd`` profile) and asserts the Excel/log/snapshot
      # triple is written. Catches the entire class of "parser-dep
      # missed by PyInstaller" bugs — rapidfuzz C-ext, openpyxl,
      # src.tn_parser submodules. The input is a real OCR'd TN PDF
      # committed at repo root (``TN_k_UPD_36_ot_02.09.2022 ocred.pdf``).
      # Because the PDF already carries a text layer, this test
      # depends ONLY on the parser half of the pipeline (skip_text=true
      # in tn_upd), isolating the parser failure mode cleanly from any
      # Tesseract / Ghostscript regression.
      - name: Smoke-test the parser (tn_upd profile → Excel)
        shell: pwsh
        # 25 минут — универсальный профиль с extract.kind=tn_upd
        # прогоняет уже OCR'нутый ТН через text-layer bypass +
        # полный парсер (ORG-catalog lookup, fuzzy-нормализация,
        # multi-row voting, auto-learn). На 8-страничном UPD_36
        # это ~3-5 мин в среднем, но Windows-CI runner медленнее
        # локального ПК, и installer-смоук запускается ПОСЛЕ
        # двух других OCR-смоуков, которые уже прогрели диск и
        # sometimes share CPU time. Старые 10 мин впритык.
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = "${{ github.workspace }}\smoke_install"
          $cli = $null
          foreach ($candidate in @(
            (Join-Path $installDir "OCRStudio.exe"),
            (Join-Path $installDir "OCR Studio.exe")
          )) {
            if (Test-Path $candidate) { $cli = $candidate; break }
          }
          if (-not $cli) {
            throw "Installed binary not found — previous smoke step should have established it"
          }

          $tnPdfOriginal = "${{ github.workspace }}\TN_k_UPD_36_ot_02.09.2022 ocred.pdf"
          if (-not (Test-Path $tnPdfOriginal)) {
            throw "Parser smoke input missing: $tnPdfOriginal (committed at repo root in PR #1)"
          }
          # Имя файла содержит ПРОБЕЛ (« ocred.pdf»). PowerShell
          # Start-Process -ArgumentList склеивает элементы массива
          # в единую command-line строку через пробел, и cli'шке
          # прилетает путь в виде ДВУХ argv'ов: «….2022» и
          # «ocred.pdf». Копируем в RUNNER_TEMP под именем без
          # пробелов — unambiguous argv.
          $tnPdf = Join-Path $env:RUNNER_TEMP "tn_upd_36_ocred.pdf"
          Copy-Item -Force -LiteralPath $tnPdfOriginal -Destination $tnPdf
          Write-Host "Copied parser-smoke input → $tnPdf"

          $xlsx = Join-Path $env:RUNNER_TEMP "parser-smoke.xlsx"
          $outPdf = Join-Path $env:RUNNER_TEMP "parser-smoke-out.pdf"
          if (Test-Path $xlsx) { Remove-Item $xlsx -Force }
          if (Test-Path "$xlsx.snapshot.json") { Remove-Item "$xlsx.snapshot.json" -Force }
          $logPath = [System.IO.Path]::ChangeExtension($xlsx, ".log")
          if (Test-Path $logPath) { Remove-Item $logPath -Force }

          Write-Host "Running universal_accurate + Excel export via installed CLI..."
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          # ``--profile universal_accurate`` — единственный builtin
          # после декабрьской 2026 консолидации. extract.enabled=True
          # и extract.kind=tn_upd слиты в него (см. profile_manager).
          # ``--excel`` делегирует в ExportManager.export_excel →
          # tn_parser.excel.write_excel_safe. Xlsx path выводится
          # из ``-o`` заменой .pdf → .xlsx. Рядом создаются
          # sidecar'ы:
          #   * ``<stem>.log``               — human-readable report
          #   * ``<stem>.xlsx.snapshot.json`` — feedback-loop snapshot
          #
          # --workers 1: детерминистично и без ProcessPool-Windows
          # quirks, чужды pipeline-verification тесту.
          $proc = Start-Process -FilePath $cli `
              -ArgumentList @(
                "--cli",
                $tnPdf,
                "-o", $outPdf,
                "--profile", "universal_accurate",
                "--excel",
                "--workers", "1"
              ) `
              -NoNewWindow -PassThru -Wait `
              -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "parser-smoke-stdout.log") `
              -RedirectStandardError  (Join-Path $env:RUNNER_TEMP "parser-smoke-stderr.log")
          $sw.Stop()
          Write-Host ("Parser smoke finished in {0:N1}s, exit code = {1}" -f $sw.Elapsed.TotalSeconds, $proc.ExitCode)
          Get-Content (Join-Path $env:RUNNER_TEMP "parser-smoke-stdout.log") -Tail 60 | Write-Host
          Get-Content (Join-Path $env:RUNNER_TEMP "parser-smoke-stderr.log") -Tail 60 | Write-Host

          if ($proc.ExitCode -ne 0) {
            throw "Installed CLI (tn_upd) exited with code $($proc.ExitCode)"
          }

          # --- File-output assertions ---------------------------------
          # Output PDF — exists + non-trivial size. Input was already
          # OCR'd, so skip_text=true in tn_upd should copy the text
          # layer through cleanly without a regression.
          if (-not (Test-Path $outPdf)) {
            throw "Installed CLI did not produce an output PDF at $outPdf"
          }
          Write-Host "Parser smoke: output PDF size $((Get-Item $outPdf).Length) bytes"

          # Excel artefact — derived path, same stem as ``-o`` with
          # .xlsx suffix (see src.cli.process_single).
          $expectedXlsx = [System.IO.Path]::ChangeExtension($outPdf, ".xlsx")
          if (-not (Test-Path $expectedXlsx)) {
            throw "Installed CLI did not produce an Excel file at $expectedXlsx — parser may have returned no rows, or Excel export failed silently"
          }
          $xlsxSize = (Get-Item $expectedXlsx).Length
          if ($xlsxSize -lt 3000) {
            # openpyxl-produced xlsx files are ≥ 4-5 KB even for a
            # single-row sheet (zip container + styles + shared
            # strings). Anything under 3 KB is almost certainly a
            # truncated / corrupt write.
            throw "Excel artefact at $expectedXlsx is suspiciously small ($xlsxSize bytes)"
          }
          Write-Host "Parser smoke: Excel artefact $xlsxSize bytes at $expectedXlsx"

          # Snapshot sidecar — required by scripts/collect_feedback.py
          # to diff operator edits against the original parser output.
          $snapshotPath = "$expectedXlsx.snapshot.json"
          if (-not (Test-Path $snapshotPath)) {
            throw "Snapshot sidecar missing: $snapshotPath (feedback-loop tooling would break)"
          }
          Write-Host "Parser smoke: snapshot sidecar OK at $snapshotPath"

          # .log sidecar — human-readable report with per-row status.
          $logSidecar = [System.IO.Path]::ChangeExtension($expectedXlsx, ".log")
          if (-not (Test-Path $logSidecar)) {
            throw "Log sidecar missing: $logSidecar"
          }
          Write-Host "Parser smoke: log sidecar OK at $logSidecar"

          # Bundle-file probe. ``--windowed`` PyInstaller builds have no
          # standalone ``python*.exe`` to run an import test through, so
          # we verify the same invariant by asserting the critical
          # parser artefacts are present on disk under the install
          # directory. Each check below maps to a concrete "silent OCR
          # job COMPLETED but result.parsed stays None" failure mode
          # that the orchestrator's graceful-degrade would otherwise
          # hide from this smoke (by design — the pipeline must not
          # fail a job when only the optional parser is broken).
          Write-Host "Verifying parser artefacts on disk..."
          $parserChecks = @(
            # rapidfuzz C-ext: at least one .pyd under the rapidfuzz/
            # tree proves the binary siblings shipped — static .py
            # files alone don't tell us the C-ext collected.
            @{
              Name = "rapidfuzz C extension"
              Pattern = "rapidfuzz*"
              Type = "dir"
              Verify = { param($p) Get-ChildItem $p -Filter "*.pyd" -Recurse | Select-Object -First 1 }
            },
            @{
              Name = "openpyxl package"
              Pattern = "openpyxl"
              Type = "dir"
            },
            @{
              # ``src.tn_parser`` — subpackage, не top-level. PyInstaller
              # в отличие от rapidfuzz/openpyxl НЕ создаёт для него
              # отдельную директорию в _internal\; модули попадают либо
              # в ``_internal\src\tn_parser\`` (если пакет не распаковался
              # в PYZ), либо в ``base_library.zip``. Ищем уникально-
              # именованный файл ``sections.py`` (принадлежит только
              # ``src.tn_parser``; других ``sections.py`` в bundle нет),
              # затем проверяем что его родительская директория
              # называется именно ``tn_parser`` — иначе мог найтись
              # одноимённый чужой файл в зависимости.
              Name = "src.tn_parser package"
              Pattern = "sections.py"
              Type = "file"
              Verify = { param($p) (Split-Path $p -Parent | Split-Path -Leaf) -eq "tn_parser" }
            },
            @{
              Name = "scripts.run_golden"
              Pattern = "scripts\run_golden.py"
              Type = "file"
            },
            @{
              Name = "profiles/tn_upd.json"
              Pattern = "profiles\tn_upd.json"
              Type = "file"
            }
          )
          foreach ($check in $parserChecks) {
            $hit = Get-ChildItem -Path $installDir -Filter (Split-Path $check.Pattern -Leaf) `
                                  -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if (-not $hit) {
              throw "Parser smoke: $($check.Name) not found in bundle (pattern: $($check.Pattern))"
            }
            if ($check.Verify) {
              $ok = & $check.Verify $hit.FullName
              if (-not $ok) {
                throw "Parser smoke: $($check.Name) present but extra verification failed"
              }
            }
            Write-Host "  ✓ $($check.Name)  -->  $($hit.FullName)"
          }
          Write-Host "Parser smoke PASSED"

      - name: Upload smoke-test artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/installer-smoke.log
            ${{ runner.temp }}/smoke-stdout.log
            ${{ runner.temp }}/smoke-stderr.log
            ${{ runner.temp }}/smoke-input.pdf
            ${{ runner.temp }}/smoke-output.pdf
            ${{ runner.temp }}/parser-smoke-stdout.log
            ${{ runner.temp }}/parser-smoke-stderr.log
            ${{ runner.temp }}/parser-smoke.xlsx
            ${{ runner.temp }}/parser-smoke-out.pdf
          if-no-files-found: ignore
          retention-days: 7

      # ------------------------------------------------------------------
      # Artifacts + release
      # ------------------------------------------------------------------
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCRStudio-Installer-${{ steps.meta.outputs.version }}
          path: |
            installer/Output/*.exe
            installer/Output/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Determine whether to publish a Release
        id: should_release
        shell: pwsh
        run: |
          $publish = "false"
          $tag = ""
          $name = ""
          $body = ""
          $prerelease = "false"

          $event = "${{ github.event_name }}"
          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"
          $manualPublish = "${{ github.event.inputs.publish }}"

          if ($event -eq "pull_request") {
            Write-Host "Pull request build — skipping release."
          } elseif ($refType -eq "tag" -and $refName.StartsWith("v")) {
            $publish = "true"
            $tag = $refName
            $name = "OCR Studio $refName"
            if ($refName -match "-(rc|beta|alpha)") {
              $prerelease = "true"
            }
            $body = "Automated build from tag ``$refName``."
          } elseif ($event -eq "workflow_dispatch" -and $manualPublish -eq "false") {
            Write-Host "Manual run with publish=false — skipping release."
          } elseif ($event -eq "push" -or $event -eq "workflow_dispatch") {
            # Rolling prerelease for non-tag pushes + manual runs.
            $publish = "true"
            $tag = "latest-dev"
            $name = "Dev build (${{ steps.meta.outputs.version }})"
            $prerelease = "true"
            $body = @"
          Automated rolling build from ``${{ github.ref_name }}`` @ ``$('${{ github.sha }}'.Substring(0, 7))``.

          This release is **overwritten on every successful build** of the
          default / development branch. Download ``OCRStudio-Setup-*.exe`` below.
          "@
          }

          "publish=$publish"        | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"                | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$name"              | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease"  | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          $bodyFile = "release_body.md"
          $body | Out-File -FilePath $bodyFile -Encoding utf8
          "body_path=$bodyFile" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        if: steps.should_release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.should_release.outputs.tag }}
          name: ${{ steps.should_release.outputs.name }}
          body_path: ${{ steps.should_release.outputs.body_path }}
          prerelease: ${{ steps.should_release.outputs.prerelease == 'true' }}
          draft: false
          make_latest: ${{ steps.should_release.outputs.prerelease != 'true' }}
          files: |
            installer/Output/*.exe
            installer/Output/*.sha256
          fail_on_unmatched_files: true

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer\Output\*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $summary = @()
          $summary += "## Build summary"
          $summary += ""
          $summary += "| Field | Value |"
          $summary += "|---|---|"
          $summary += "| Version | ``${{ steps.meta.outputs.version }}`` |"
          $summary += "| Kind | ``${{ steps.meta.outputs.kind }}`` |"
          $summary += "| Ref | ``${{ github.ref }}`` |"
          $summary += "| Commit | ``${{ github.sha }}`` |"
          if ($installer) {
            $sizeMB = [math]::Round($installer.Length/1MB, 1)
            $summary += "| Installer | ``$($installer.Name)`` (${sizeMB} MB) |"
          }
          $publish = "${{ steps.should_release.outputs.publish }}"
          $tag = "${{ steps.should_release.outputs.tag }}"
          if ($publish -eq "true") {
            $summary += "| Release | Published to tag ``$tag`` |"
          } else {
            $summary += "| Release | (not published) |"
          }
          ($summary -join "`n") | Out-File -FilePath $Env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
