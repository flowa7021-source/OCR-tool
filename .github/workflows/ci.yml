name: CI

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade pip ruff
      - run: ruff check src tests

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 on Linux needs these at runtime even in offscreen mode
      - name: Install Linux Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy opencv-python-headless scikit-image Pillow
          pip install python-docx PyMuPDF psutil
          pip install pytest pytest-mock pytest-cov

      - name: Compile-check all sources
        run: python -m compileall -q src tests build.py dev_run.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ --tb=short -q

  syntax:
    name: Syntax / Import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install numpy
      - name: compileall
        run: python -m compileall -q src tests build.py dev_run.py
      - name: Import foundational modules (no heavy deps)
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from src.shared import types, constants, validators
          from src.core import models, text_postprocessor
          from src.application import queue_manager, profile_manager, ocrmypdf_integration, recovery_manager
          from src.infrastructure import file_utils, config_storage, logger
          print('OK')
          "
