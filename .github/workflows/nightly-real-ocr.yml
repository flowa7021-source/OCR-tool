name: Nightly real-OCR corpus

# Runs every night plus on-demand from the Actions tab. Separate from
# PR CI because 100+ real-OCR passes take 15-50 min wall time — too
# expensive to gate every push on, but the right cadence to catch
# "fixture-matrix regressed" before a release cut.
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:       # manual trigger from the Actions tab
  # TEMPORARY: run on push while we validate Initiative 1 stages
  # A-D (benchmark, script detection, garbage filter, user dicts)
  # against real Windows + Tesseract. Remove after the first
  # green run establishes the baseline CER/WER.
  push:
    branches:
      - "claude/**"
    paths:
      - "src/core/script_detector.py"
      - "src/core/garbage_filter.py"
      - "src/core/text_postprocessor.py"
      - "src/core/models.py"
      - "src/application/ocrmypdf_integration.py"
      - "src/application/engines/**"
      - "resources/tessdata/user-*"
      - "tests/fixtures/accuracy_corpus/**"
      - "tests/integration/test_accuracy_benchmark.py"
      - ".github/workflows/nightly-real-ocr.yml"

concurrency:
  group: nightly-real-ocr
  cancel-in-progress: false   # let yesterday's run finish if overlap

jobs:
  nightly:
    name: Nightly real-OCR (Windows)
    # Windows is the production target — bundled Tesseract /
    # Ghostscript / installer are Windows-only, so the nightly
    # accuracy + corpus runs must exercise the same OS the users
    # actually install on. Ubuntu was a cost-saving shortcut; the
    # CLAUDE.md "Windows priority" rule overrides it.
    runs-on: windows-latest
    timeout-minutes: 120   # Windows runners are ~2× slower than Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Windows CI leg: install Tesseract + Ghostscript via Chocolatey
      # (same mechanism as the per-PR CI in ci.yml) and expose
      # TESSDATA_PREFIX so the pipeline picks up the system tessdata.
      - name: Install Tesseract + Ghostscript (Chocolatey)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          choco install ghostscript --no-progress -y
          # Chocolatey installs tessdata next to tesseract.exe.
          $tess = Get-Command tesseract -ErrorAction SilentlyContinue
          if ($tess) {
            $tessdir = Split-Path $tess.Source
            $tessdata = Join-Path $tessdir "tessdata"
            if (Test-Path $tessdata) {
              echo "TESSDATA_PREFIX=$tessdata" >> $env:GITHUB_ENV
              Write-Host "TESSDATA_PREFIX=$tessdata"
            }
          }

      # Chocolatey's tesseract package ships ``eng.traineddata`` only.
      # The accuracy benchmark + retry-tier tests need Russian
      # recognition, so fetch ``rus`` and ``osd`` from the official
      # tessdata_best repo and drop them next to eng.
      #
      # Note on PATH discovery: Chocolatey updates system PATH during
      # its install step, but the CURRENT PowerShell process keeps
      # the old PATH snapshot until ``refreshenv`` or a new shell.
      # ``Get-Command tesseract`` in this step would fail with
      # "tesseract not on PATH" even though the binary is installed
      # at the well-known Chocolatey location. Fall back to the
      # canonical install directory when the PATH lookup misses.
      - name: Download rus + osd traineddata
        shell: pwsh
        run: |
          $tess = Get-Command tesseract -ErrorAction SilentlyContinue
          if ($tess) {
            $tessdir = Split-Path $tess.Source
          } else {
            $tessdir = "C:\Program Files\Tesseract-OCR"
            $exe = Join-Path $tessdir "tesseract.exe"
            if (-not (Test-Path $exe)) {
              throw (
                "tesseract not on PATH and not at the default " +
                "Chocolatey install location ($tessdir). " +
                "Check the 'Install Tesseract + Ghostscript' step."
              )
            }
            Write-Host "Using Chocolatey default location: $tessdir"
            # Also expose it to subsequent steps so the pipeline's
            # own PATH discovery works when it shells out.
            echo "$tessdir" >> $env:GITHUB_PATH
          }
          $tessdata = Join-Path $tessdir "tessdata"
          if (-not (Test-Path $tessdata)) {
            New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          }
          # Re-export TESSDATA_PREFIX in case the previous step
          # skipped it (it gated on Get-Command too).
          echo "TESSDATA_PREFIX=$tessdata" >> $env:GITHUB_ENV
          $base = "https://github.com/tesseract-ocr/tessdata_best/raw/main"
          foreach ($lang in @("rus", "osd")) {
            $out = Join-Path $tessdata "$lang.traineddata"
            if (Test-Path $out) {
              Write-Host "Already present: $lang.traineddata"
              continue
            }
            Write-Host "Downloading $lang.traineddata to $out"
            $tries = 0
            while ($tries -lt 3) {
              try {
                Invoke-WebRequest -Uri "$base/$lang.traineddata" `
                    -OutFile $out -UseBasicParsing
                break
              } catch {
                $tries++
                if ($tries -ge 3) { throw }
                Start-Sleep -Seconds (2 * $tries)
              }
            }
          }
          Get-ChildItem $tessdata -Filter "*.traineddata" |
              Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy opencv-python-headless scikit-image Pillow
          pip install python-docx PyMuPDF psutil deskew cffi
          pip install ocrmypdf pytesseract
          pip install pytest pytest-mock pytest-cov pytest-qt pytest-benchmark
          # jiwer powers tests/integration/test_accuracy_benchmark.py
          pip install jiwer

      - name: Generate nightly fixtures (20-doc corpus)
        shell: pwsh
        run: |
          python tests/fixtures/generate_fixtures.py --nightly

      - name: Generate accuracy-benchmark corpus
        shell: pwsh
        run: |
          python tests/fixtures/accuracy_corpus/generate.py

      # Three stages: adversarial retry-tier tests (fastest signal)
      # first, then the accuracy benchmark (mid-speed), then the
      # full 20-doc corpus (slow, exhaustive). Split so a crash
      # in stage 1 is visible before stage 3 spends 30+ min.
      - name: Stage 1 — adversarial retry-tier tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/integration/test_e2e_retry_tiers.py `
                 tests/integration/test_e2e_engine_real.py `
                 --tb=short -v

      - name: Stage 2 — accuracy benchmark (CER / WER)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          OCR_ACCURACY_BENCHMARK: "1"
        run: |
          pytest tests/integration/test_accuracy_benchmark.py `
                 --tb=short -v

      - name: Stage 3 — full nightly corpus matrix
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          OCR_NIGHTLY: "1"
        run: |
          pytest tests/integration/test_nightly_corpus.py `
                 --tb=short -v

      # On failure: upload the generated corpus + any produced output
      # PDFs so a maintainer can reproduce without regenerating from
      # scratch. Retention is short — corpus regenerates deterministically.
      - name: Upload fixtures + output PDFs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-corpus-and-outputs
          path: |
            tests/fixtures/nightly/*.pdf
            tests/fixtures/*.pdf
          retention-days: 7
