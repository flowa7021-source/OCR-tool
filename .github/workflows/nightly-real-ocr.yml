name: Nightly real-OCR corpus

# Runs every night plus on-demand from the Actions tab. Separate from
# PR CI because 100+ real-OCR passes take 15-50 min wall time — too
# expensive to gate every push on, but the right cadence to catch
# "fixture-matrix regressed" before a release cut.
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:       # manual trigger from the Actions tab
  # TEMPORARY: run on push while we validate Initiative 1 stages
  # A-D (benchmark, script detection, garbage filter, user dicts)
  # against real Windows + Tesseract. Remove after the first
  # green run establishes the baseline CER/WER.
  push:
    branches:
      - "claude/**"
    paths:
      - "src/core/script_detector.py"
      - "src/core/garbage_filter.py"
      - "src/core/text_postprocessor.py"
      - "src/core/models.py"
      - "src/application/ocrmypdf_integration.py"
      - "src/application/engines/**"
      - "resources/tessdata/user-*"
      - "tests/fixtures/accuracy_corpus/**"
      # Every test file this workflow actually runs — not just the
      # accuracy benchmark. If a retry-tier or corpus-matrix test
      # changes, nightly should re-exercise it too.
      - "tests/integration/test_accuracy_benchmark.py"
      - "tests/integration/test_e2e_retry_tiers.py"
      - "tests/integration/test_e2e_engine_real.py"
      - "tests/integration/test_nightly_corpus.py"
      # GOT-OCR 2.0 real-inference stage. Any change to the engine
      # code, the model-manager manifest, or the download script
      # must re-run nightly so a broken bundle path can't slip
      # past on a green PR CI.
      - "tests/integration/test_e2e_got_ocr2_real.py"
      - "src/application/engines/got_ocr_engine.py"
      - "src/infrastructure/model_manager.py"
      - ".github/scripts/download_got_ocr2.py"
      # Shared helper that decides REAL_OCR_AVAILABLE and
      # RUSSIAN_OCR_AVAILABLE for every real-OCR test. A change here
      # (e.g. the recent gswin64c Windows-path fix) can silently
      # flip the whole nightly between "runs" and "skips everything",
      # so it belongs in the trigger paths.
      - "tests/integration/_real_ocr_helpers.py"
      - ".github/workflows/nightly-real-ocr.yml"

concurrency:
  group: nightly-real-ocr
  cancel-in-progress: false   # let yesterday's run finish if overlap

# Stage 2 can auto-commit a freshly captured ``baseline.json`` back to
# the branch so the next nightly can run the regression-assertion path.
# Requires ``contents: write`` on the workflow token; default per-job
# token permissions are read-only since 2023.
permissions:
  contents: write

jobs:
  nightly:
    name: Nightly real-OCR (Windows)
    # Windows is the production target — bundled Tesseract /
    # Ghostscript / installer are Windows-only, so the nightly
    # accuracy + corpus runs must exercise the same OS the users
    # actually install on. Ubuntu was a cost-saving shortcut; the
    # CLAUDE.md "Windows priority" rule overrides it.
    runs-on: windows-latest
    timeout-minutes: 120   # Windows runners are ~2× slower than Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Windows CI leg: install Tesseract + Ghostscript via Chocolatey
      # (same mechanism as the per-PR CI in ci.yml) and expose
      # TESSDATA_PREFIX so the pipeline picks up the system tessdata.
      #
      # Chocolatey updates system PATH during install, but the
      # current PowerShell process keeps a stale PATH snapshot.
      # Later steps see the fresh system PATH through GitHub
      # Actions' environment propagation, BUT within a step it's
      # still stale. Append the canonical install locations to
      # ``GITHUB_PATH`` so subsequent steps find the binaries
      # regardless of Chocolatey's own PATH timing.
      - name: Install Tesseract + Ghostscript (Chocolatey)
        shell: pwsh
        run: |
          # Chocolatey's community feed occasionally returns 504
          # Gateway Timeout for package metadata. Retry with
          # exponential backoff so a flaky CDN doesn't kill the run.
          function Install-ChocoPackage {
            param([string]$Name)
            $maxAttempts = 4
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              Write-Host "choco install $Name (attempt $attempt/$maxAttempts)"
              choco install $Name --no-progress -y
              if ($LASTEXITCODE -eq 0) { return }
              if ($attempt -lt $maxAttempts) {
                $wait = [math]::Pow(2, $attempt) * 5
                Write-Host "choco install $Name failed (exit $LASTEXITCODE); retrying in ${wait}s"
                Start-Sleep -Seconds $wait
              }
            }
            throw "choco install $Name failed after $maxAttempts attempts"
          }

          Install-ChocoPackage -Name "tesseract"
          Install-ChocoPackage -Name "ghostscript"

          # Canonical Tesseract install location.
          $tessInstall = "C:\Program Files\Tesseract-OCR"
          if (Test-Path (Join-Path $tessInstall "tesseract.exe")) {
            echo "$tessInstall" >> $env:GITHUB_PATH
            $tessdata = Join-Path $tessInstall "tessdata"
            if (Test-Path $tessdata) {
              echo "TESSDATA_PREFIX=$tessdata" >> $env:GITHUB_ENV
              Write-Host "TESSDATA_PREFIX=$tessdata"
            }
          }

          # Ghostscript: Chocolatey installs into
          # ``C:\Program Files\gs\gsVERSION\bin``. Version changes
          # per release, so scan for any gs* subdirectory.
          $gsRoot = "C:\Program Files\gs"
          if (Test-Path $gsRoot) {
            $gsBin = Get-ChildItem $gsRoot -Directory |
                     ForEach-Object { Join-Path $_.FullName "bin" } |
                     Where-Object { Test-Path (Join-Path $_ "gswin64c.exe") } |
                     Select-Object -First 1
            if ($gsBin) {
              echo "$gsBin" >> $env:GITHUB_PATH
              Write-Host "Ghostscript bin added to PATH: $gsBin"
            } else {
              Write-Warning "No gswin64c.exe found under $gsRoot"
            }
          } else {
            Write-Warning "Ghostscript install root $gsRoot not found"
          }

      # Chocolatey's tesseract package ships ``eng.traineddata`` only.
      # The accuracy benchmark + retry-tier tests need Russian
      # recognition, so fetch ``rus`` and ``osd`` from the official
      # tessdata_best repo and drop them next to eng.
      #
      # Note on PATH discovery: Chocolatey updates system PATH during
      # its install step, but the CURRENT PowerShell process keeps
      # the old PATH snapshot until ``refreshenv`` or a new shell.
      # ``Get-Command tesseract`` in this step would fail with
      # "tesseract not on PATH" even though the binary is installed
      # at the well-known Chocolatey location. Fall back to the
      # canonical install directory when the PATH lookup misses.
      - name: Download rus + osd traineddata
        shell: pwsh
        run: |
          $tess = Get-Command tesseract -ErrorAction SilentlyContinue
          if ($tess) {
            $tessdir = Split-Path $tess.Source
          } else {
            $tessdir = "C:\Program Files\Tesseract-OCR"
            $exe = Join-Path $tessdir "tesseract.exe"
            if (-not (Test-Path $exe)) {
              throw (
                "tesseract not on PATH and not at the default " +
                "Chocolatey install location ($tessdir). " +
                "Check the 'Install Tesseract + Ghostscript' step."
              )
            }
            Write-Host "Using Chocolatey default location: $tessdir"
            # Also expose it to subsequent steps so the pipeline's
            # own PATH discovery works when it shells out.
            echo "$tessdir" >> $env:GITHUB_PATH
          }
          $tessdata = Join-Path $tessdir "tessdata"
          if (-not (Test-Path $tessdata)) {
            New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          }
          # Re-export TESSDATA_PREFIX in case the previous step
          # skipped it (it gated on Get-Command too).
          echo "TESSDATA_PREFIX=$tessdata" >> $env:GITHUB_ENV
          $base = "https://github.com/tesseract-ocr/tessdata_best/raw/main"
          foreach ($lang in @("rus", "osd")) {
            $out = Join-Path $tessdata "$lang.traineddata"
            if (Test-Path $out) {
              Write-Host "Already present: $lang.traineddata"
              continue
            }
            Write-Host "Downloading $lang.traineddata to $out"
            $tries = 0
            while ($tries -lt 3) {
              try {
                Invoke-WebRequest -Uri "$base/$lang.traineddata" `
                    -OutFile $out -UseBasicParsing
                break
              } catch {
                $tries++
                if ($tries -ge 3) { throw }
                Start-Sleep -Seconds (2 * $tries)
              }
            }
          }
          Get-ChildItem $tessdata -Filter "*.traineddata" |
              Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy opencv-python-headless scikit-image Pillow
          pip install python-docx PyMuPDF psutil deskew cffi
          pip install ocrmypdf pytesseract
          pip install pytest pytest-mock pytest-cov pytest-qt pytest-benchmark
          # jiwer powers tests/integration/test_accuracy_benchmark.py
          pip install jiwer

      - name: Generate nightly fixtures (20-doc corpus)
        shell: pwsh
        run: |
          python tests/fixtures/generate_fixtures.py --nightly

      - name: Generate accuracy-benchmark corpus
        shell: pwsh
        run: |
          python tests/fixtures/accuracy_corpus/generate.py

      # Three stages: adversarial retry-tier tests (fastest signal)
      # first, then the accuracy benchmark (mid-speed), then the
      # full 20-doc corpus (slow, exhaustive). Split so a crash
      # in stage 1 is visible before stage 3 spends 30+ min.
      - name: Stage 1 — adversarial retry-tier tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/integration/test_e2e_retry_tiers.py `
                 tests/integration/test_e2e_engine_real.py `
                 --tb=short -v

      - name: Stage 2 — accuracy benchmark (CER / WER)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          OCR_ACCURACY_BENCHMARK: "1"
        run: |
          # If baseline.json is missing OR contains no real metrics
          # (the committed file is a placeholder with only ``_comment``
          # until the first nightly populates it), capture it via
          # ``--regenerate-baseline``. The artifact upload below picks
          # it up so the maintainer can commit. Once a real baseline is
          # in the repo, subsequent nightlies run the assertion path.
          $baseline = "tests/fixtures/accuracy_corpus/baseline.json"
          $needsCapture = $true
          if (Test-Path $baseline) {
            try {
              $data = Get-Content $baseline -Raw | ConvertFrom-Json
              $docKeys = @(
                $data.PSObject.Properties.Name |
                  Where-Object { $_ -notlike "_*" }
              )
              if ($docKeys.Count -gt 0) {
                $needsCapture = $false
                Write-Host "Using committed baseline ($($docKeys.Count) docs)"
              } else {
                Write-Host "baseline.json present but holds no doc metrics — capturing"
              }
            } catch {
              Write-Warning "baseline.json could not be parsed ($_); capturing fresh"
            }
          } else {
            Write-Host "No baseline.json — capturing a new one"
          }
          $regen = @()
          if ($needsCapture) { $regen = @("--regenerate-baseline") }
          pytest tests/integration/test_accuracy_benchmark.py `
                 --tb=short -v @regen

      # Auto-commit a freshly captured baseline back to the branch so the
      # next nightly runs the regression-assertion path without a human
      # having to download the artifact + push manually. The commit
      # message carries ``[skip ci]`` so GitHub Actions does NOT
      # re-trigger nightly (or any other workflow) on this push, which
      # would otherwise cause an infinite loop since ``baseline.json``
      # is inside the nightly's ``paths`` trigger.
      #
      # Guarded by ``git status`` so the step is a no-op when the
      # committed baseline was already real and we ran the assertion
      # path. Guarded by ``if: success()`` so a failed Stage 2 never
      # half-commits partial results.
      - name: Auto-commit captured baseline
        if: success()
        shell: pwsh
        run: |
          $baseline = "tests/fixtures/accuracy_corpus/baseline.json"
          git diff --quiet -- $baseline
          if ($LASTEXITCODE -eq 0) {
            Write-Host "baseline.json unchanged — nothing to commit"
            exit 0
          }
          Write-Host "baseline.json was captured — committing back to branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $baseline
          $msg = "Capture Windows accuracy baseline (nightly run $($env:GITHUB_RUN_ID)) [skip ci]"
          git commit -m $msg
          # ``github.ref_name`` is the branch we're running on; push to
          # the same remote ref. Retry briefly on transient 5xx from
          # the push endpoint.
          $branch = "${{ github.ref_name }}"
          $tries = 0
          while ($tries -lt 3) {
            git push origin "HEAD:$branch"
            if ($LASTEXITCODE -eq 0) { break }
            $tries++
            if ($tries -ge 3) {
              throw "git push failed after $tries retries"
            }
            Start-Sleep -Seconds (5 * $tries)
            # Pull --rebase in case a concurrent push landed first.
            git pull --rebase origin $branch
          }

      - name: Upload captured accuracy baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-baseline-${{ github.run_id }}
          path: tests/fixtures/accuracy_corpus/baseline.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Stage 3 — full nightly corpus matrix
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          OCR_NIGHTLY: "1"
        run: |
          pytest tests/integration/test_nightly_corpus.py `
                 --tb=short -v

      # Stage 4: real GOT-OCR 2.0 inference. Until this stage landed
      # (Apr 2026), every GOT-OCR test in the suite was stubbed —
      # torch / transformers / einops / accelerate / torchvision /
      # verovio / tiktoken / safetensors were all replaced with
      # SimpleNamespace fakes. That caught profile-dispatch wiring
      # regressions but would let a genuine transformer bug ship
      # (corrupt bundled weights, ``_recognize_page`` typo, stale
      # ``trust_remote_code`` modules, torchvision's native C++
      # ops failing to load). This stage downloads the real 580 MB
      # model (cached by key) and runs ONE end-to-end inference
      # per test case against actual torch.
      #
      # Runs AFTER Tesseract stages so a Tesseract regression
      # surfaces first (fastest signal); this stage's ~20-40 min
      # cost kicks in only once the rest is green.
      - name: Install HTR deps (torch + transformers + tokenizer stack)
        shell: pwsh
        run: |
          # CPU-only torch wheel keeps the install under 1 GB —
          # the Windows CI runner has no GPU anyway.
          #
          # transformers MUST be <4.46: upstream Stepfun's
          # ``modeling_GOT.py`` uses the pre-4.46 DynamicCache API
          # (``past_key_values.seen_tokens``) which the 4.46+
          # release removed. Loading GOT on newer transformers
          # crashes mid-inference with:
          #   'DynamicCache' object has no attribute 'seen_tokens'
          # 4.37 is the lower bound Stepfun's own README validates
          # against. Match the ``pyproject [htr]`` extras pin.
          pip install --index-url https://download.pytorch.org/whl/cpu `
                      torch torchvision
          pip install "transformers>=4.37,<4.46" tiktoken safetensors `
                      "einops>=0.7" "accelerate>=0.25" "verovio>=4.0"

      - name: Cache GOT-OCR 2.0 weights
        id: cache-got-ocr2-nightly
        uses: actions/cache@v4
        with:
          path: resources/models/got_ocr2
          key: got-ocr2-weights-${{ hashFiles('src/infrastructure/model_manager.py', '.github/scripts/download_got_ocr2.py') }}

      - name: Download GOT-OCR 2.0 weights
        if: steps.cache-got-ocr2-nightly.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python .github/scripts/download_got_ocr2.py

      - name: Stage 4 — real GOT-OCR 2.0 inference
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # ``ModelManager`` resolves ``BUNDLED_MODELS_DIR`` to
          # ``<repo_root>/resources/models/`` in dev checkouts (it's
          # anchored on ``get_app_root`` which falls back to the
          # repo root off-bundle). The download step above wrote
          # the 11 manifest files to exactly that path, so
          # ``is_available("got_ocr2")`` sees them without any env
          # var plumbing.
          pytest tests/integration/test_e2e_got_ocr2_real.py `
                 --tb=short -v

      # On failure: upload the generated corpus + any produced output
      # PDFs so a maintainer can reproduce without regenerating from
      # scratch. Retention is short — corpus regenerates deterministically.
      - name: Upload fixtures + output PDFs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-corpus-and-outputs
          path: |
            tests/fixtures/nightly/*.pdf
            tests/fixtures/*.pdf
          retention-days: 7
