name: Release

# Tag-gated release orchestration.
#
# When a tag matching `v*` is pushed:
#
#   1. `gate-tests`: re-run the full unit + integration test suite on
#      the tagged commit (belt and braces — CI on the same ref likely
#      already passed but we don't want to gamble).
#   2. `build`: invoke `.github/workflows/build-installer.yml` as a
#      reusable workflow (`workflow_call`), so release artefacts are
#      produced by the same pipeline as normal CI builds.
#   3. `sign`: if `SIGNING_CERTIFICATE_PFX_BASE64` +
#      `SIGNING_CERTIFICATE_PASSWORD` secrets are configured, signtool
#      signs the installer with a SHA256 timestamp. Without the
#      secrets we publish unsigned with a clear warning in the log.
#   4. `publish`: create a GitHub Release with auto-generated notes,
#      attach the installer and the (possibly regenerated) .sha256.
#
# Manual `workflow_dispatch` with `dry_run=true` builds + signs but
# stops short of publishing — lets us validate the signing pipeline
# without cutting a real release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build & sign but DO NOT publish a GitHub Release"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-tests:
    name: Re-run test suite on the release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy opencv-python-headless scikit-image Pillow
          pip install python-docx PyMuPDF psutil
          pip install pytest pytest-mock pytest-cov pytest-qt pytest-benchmark
      - name: Run unit + integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ --tb=short -q

  # Reuse the canonical build workflow — no duplicated PyInstaller logic.
  build:
    name: Build installer via reusable workflow
    needs: gate-tests
    uses: ./.github/workflows/build-installer.yml
    secrets: inherit

  sign:
    name: Sign installer (optional)
    needs: build
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      PFX_B64: ${{ secrets.SIGNING_CERTIFICATE_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - name: Download installer artefact from build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.installer_artifact }}
          path: dist/

      - name: Detect signing secrets
        id: secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_B64) -or [string]::IsNullOrEmpty($env:PFX_PASSWORD)) {
            Write-Warning "Signing secrets not configured; installer will be published UNSIGNED."
            Write-Warning "Set SIGNING_CERTIFICATE_PFX_BASE64 + SIGNING_CERTIFICATE_PASSWORD to sign."
            "have_cert=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "have_cert=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Decode signing certificate
        if: steps.secrets.outputs.have_cert == 'true'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_B64)
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          "PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign installer
        id: sign
        if: steps.secrets.outputs.have_cert == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist/*.exe -Recurse | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer .exe found under dist/"
            exit 1
          }
          & signtool.exe sign `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /f $env:PFX_PATH `
            /p $env:PFX_PASSWORD `
            $installer.FullName
          & signtool.exe verify /pa /v $installer.FullName
          # Regenerate checksum — signing mutates the file bytes.
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii "$($installer.FullName).sha256"
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Mark as unsigned
        if: steps.secrets.outputs.have_cert != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::Installer published UNSIGNED."
          "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload final release artefact
        uses: actions/upload-artifact@v4
        with:
          name: installer-final
          path: dist/**/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: sign
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.dry_run != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final installer
        uses: actions/download-artifact@v4
        with:
          name: installer-final
          path: dist/

      - name: Flatten dist directory for release attachments
        run: |
          mkdir -p flat
          find dist -type f \( -name "*.exe" -o -name "*.sha256" \) -exec cp {} flat/ \;
          ls -la flat/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flat/*.exe
            flat/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body: |
            Installer built from tag `${{ github.ref_name }}`.

            Signing status: **${{ needs.sign.outputs.signed == 'true' && 'signed (SHA256)' || 'unsigned — SmartScreen warning applies' }}**.

            Verify the download:

            ```powershell
            Get-FileHash OCR-Studio-Setup-*.exe -Algorithm SHA256
            ```
