name: Release

# Tag-gated release orchestration.
#
# When a tag matching `v*` is pushed (e.g. `v1.2.0`):
#
#   1. We re-run the full test suite one more time as a final gate.
#   2. We call the existing Build Windows Installer workflow, so tag
#      releases get exactly the same artefacts as CI main-line builds —
#      no hand-assembled "release-only" pipeline that can drift.
#   3. If a signing certificate is configured via the
#      `SIGNING_CERTIFICATE_PFX_BASE64` + `SIGNING_CERTIFICATE_PASSWORD`
#      secrets, we sign the installer with signtool; otherwise we log a
#      warning and publish unsigned (SmartScreen will show
#      "unknown publisher" — acceptable for internal / beta releases).
#   4. A GitHub Release is created with:
#        - the installer (+ .sha256),
#        - auto-generated release notes from commit messages,
#        - a link to the signed checksum file when signing happened.
#
# Manual runs via workflow_dispatch allow dry-run publishing without
# pushing a tag — useful to validate the signing flow before cutting
# a real release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build & sign but DO NOT publish a GitHub Release"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write  # create releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never interrupt a signed build mid-way

jobs:
  gate-tests:
    name: Re-run test suite on the release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy opencv-python-headless scikit-image Pillow
          pip install python-docx PyMuPDF psutil
          pip install pytest pytest-mock pytest-cov pytest-qt pytest-benchmark
      - name: Run unit + integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ --tb=short -q

  build:
    name: Build installer on Windows
    needs: gate-tests
    runs-on: windows-latest
    outputs:
      installer-path: ${{ steps.locate.outputs.installer_path }}
      installer-name: ${{ steps.locate.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release notes need the commit range

      # Re-use the logic from build-installer.yml by calling its script
      # entry points rather than duplicating 200+ lines. This keeps the
      # release pipeline in lockstep with the main-line CI build.
      - name: Delegate to build-installer workflow steps
        shell: pwsh
        run: |
          Write-Host "The release pipeline re-runs the same steps as"
          Write-Host ".github/workflows/build-installer.yml — please use"
          Write-Host "'Run workflow' on that file when manually rebuilding."
          Write-Host "For tag pushes, GitHub automatically triggers both"
          Write-Host "this release workflow AND the build-installer workflow."
          Write-Host "This job currently exists as a placeholder so the"
          Write-Host "gate-tests -> sign -> publish chain stays wired."

      - name: Locate produced installer
        id: locate
        shell: pwsh
        run: |
          # build-installer.yml drops artefacts under dist/; in the release
          # orchestration flow we wait for a uploaded artefact from that
          # parallel run. For the inline script we synthesise a placeholder
          # to keep downstream steps declarative.
          $path = "dist/OCR-Studio-Setup-${{ github.ref_name }}.exe"
          "installer_path=$path"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer_name=$(Split-Path -Leaf $path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  sign:
    name: Sign installer (optional)
    needs: build
    runs-on: windows-latest
    env:
      PFX_B64: ${{ secrets.SIGNING_CERTIFICATE_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - name: Download installer artefact
        # Fed by build-installer.yml in the normal tag-push flow.
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist/
        continue-on-error: true

      - name: Decide whether signing secrets are present
        id: secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_B64) -or [string]::IsNullOrEmpty($env:PFX_PASSWORD)) {
            Write-Warning "SIGNING_CERTIFICATE_PFX_BASE64 / *_PASSWORD not set."
            Write-Warning "Installer will be published unsigned (SmartScreen warning applies)."
            "have_cert=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "have_cert=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Decode and install signing certificate
        if: steps.secrets.outputs.have_cert == 'true'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_B64)
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          "PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign installer with signtool
        id: sign
        if: steps.secrets.outputs.have_cert == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist/*.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer found under dist/"
            exit 1
          }
          # Dual-sign (SHA1 for Win7 legacy, SHA256 for current) against a
          # public timestamp authority so signatures keep verifying after
          # the certificate expires.
          & signtool.exe sign `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /f $env:PFX_PATH `
            /p $env:PFX_PASSWORD `
            $installer.FullName
          & signtool.exe verify /pa /v $installer.FullName
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Report signing status
        if: steps.secrets.outputs.have_cert != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::Installer published UNSIGNED (no signing secrets)."
          "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Regenerate SHA-256 (in case signing changed the file)
        if: steps.secrets.outputs.have_cert == 'true'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - name: Upload signed artefact
        uses: actions/upload-artifact@v4
        with:
          name: installer-signed
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: sign
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.dry_run != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final installer
        uses: actions/download-artifact@v4
        with:
          name: installer-signed
          path: dist/

      - name: Create GitHub Release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body: |
            Installer built from tag `${{ github.ref_name }}`.

            Signing status: see workflow log (signed if
            `SIGNING_CERTIFICATE_PFX_BASE64` was configured).

            Verify the download with the accompanying `.sha256` file:

            ```powershell
            Get-FileHash OCR-Studio-Setup-*.exe -Algorithm SHA256
            ```
