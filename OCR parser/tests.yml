name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows — единственная рабочая среда пользователя. Держим только
        # её, чтобы CI повторял реальный путь: Windows + кодировки + блокировка
        # Excel + пути с обратными слешами.
        os: [windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit + golden + E2E tests
        # Гоняем ВЕСЬ suite: unit (fields/sections/validators), golden
        # (snapshot-кейсы для реальных OCR-текстов) и E2E (синтетический
        # PDF → CLI → Excel). На Windows это ровно тот же маршрут, по
        # которому ходит пользователь.
        run: python -m pytest -v --tb=short
