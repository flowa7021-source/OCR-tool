[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-studio"
version = "2.0.0"
description = "Professional OCR desktop application for Windows (EasyOCR ru+en) with searchable PDF generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OCR Studio Team" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "easyocr>=1.7",
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-python>=4.9",
    "PyMuPDF>=1.24",
    "deskew>=1.5",
    "page-dewarp>=0.1",
    "python-docx>=1.1",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "Pillow>=10.0",
    "psutil>=5.9",
    "openpyxl>=3.1",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
# Opt-in LLM-fallback (Claude API) for the ТН / УПД parser. NOT
# bundled by default — the shipped Windows installer stays fully
# offline per CLAUDE.md ("приложение должно работать без сети").
# Installed by users who want the rescue for low-confidence rows:
#
#     pip install "ocr-studio[llm]"
#
# ``anthropic`` pulls in httpx + pydantic; the pinned pydantic here
# matches the version ``anthropic.messages.parse(output_format=...)``
# uses for structured-output validation.
llm = [
    "anthropic>=0.34",
    "pydantic>=2.7",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "pytest-mock>=3.10",
    "pytest-benchmark>=4.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.6",
    # OCR accuracy benchmark. ``jiwer`` computes CER/WER via Levenshtein
    # distance — the industry-standard quantitative metric for OCR
    # regression testing. Keeps the test corpus honest: if a
    # preprocessing tweak improves one document and silently regresses
    # another, the benchmark flags it before merge.
    "jiwer>=3.0",
]

[project.scripts]
ocr-studio = "src.main:main"
ocr-cli = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Default test runs ignore tests/benchmarks/ — those are slow and meant
# to be invoked explicitly with `pytest tests/benchmarks --benchmark-only`.
testpaths = ["tests/unit", "tests/integration", "tests/parsers"]
python_files = "test_*.py"
# ``-m "not slow and not parser_golden"`` — goldens и slow (real OCR)
# гоняются отдельно в nightly workflow.
addopts = '-v --tb=short -m "not slow and not parser_golden"'
markers = [
    "benchmark: explicit performance benchmark (run via tests/benchmarks)",
    "slow: real model load / real OCR — run manually or in nightly",
    "parser_golden: real-PDF golden regression suite (slow, nightly-only)",
]
filterwarnings = [
    "ignore::DeprecationWarning:multiprocessing",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
    "ignore::DeprecationWarning:torch",
    "ignore::UserWarning:torch",
]
