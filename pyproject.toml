[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-studio"
version = "1.0.0"
description = "Professional OCR desktop application for Windows with advanced preprocessing and searchable PDF generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OCR Studio Team" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "ocrmypdf>=16.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.9",
    "PyMuPDF>=1.24",
    "deskew>=1.5",
    "page-dewarp>=0.1",
    "python-docx>=1.1",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "Pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.6",
]

[project.scripts]
ocr-studio = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
