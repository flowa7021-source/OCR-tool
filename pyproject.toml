[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-studio"
version = "1.1.0"
description = "Professional OCR desktop application for Windows with advanced preprocessing and searchable PDF generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OCR Studio Team" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "ocrmypdf>=16.0,<17.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.9",
    "PyMuPDF>=1.24",
    "deskew>=1.5",
    "page-dewarp>=0.1",
    "python-docx>=1.1",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "Pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "pytest-mock>=3.10",
    "pytest-benchmark>=4.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.6",
    # OCR accuracy benchmark. ``jiwer`` computes CER/WER via Levenshtein
    # distance — the industry-standard quantitative metric for OCR
    # regression testing. Keeps the test corpus honest: if a
    # preprocessing tweak improves one document and silently regresses
    # another, the benchmark flags it before merge.
    "jiwer>=3.0",
]
# Optional handwriting / transformer-OCR back-ends. Adds GOT-OCR 2.0
# support (Apache-2.0). The model weights themselves (~580 MB) are
# downloaded at runtime via the in-app "Download GOT-OCR 2.0" action.
# Pillow is already a base dependency so we don't list it again.
htr = [
    "torch>=2.1",
    "torchvision>=0.16",
    # GOT-OCR 2.0's ``trust_remote_code`` ``modeling_GOT.py`` uses the
    # transformers ≤4.45 DynamicCache API (``past_key_values.seen_tokens``).
    # transformers 4.46+ removed that attribute; loading GOT under
    # newer transformers crashes mid-inference with:
    #     'DynamicCache' object has no attribute 'seen_tokens'
    # Upstream Stepfun hasn't refreshed the model card since 2024-09,
    # so pinning is the tractable fix. Lower bound matches what
    # Stepfun's own README validates against.
    "transformers>=4.37,<4.46",
    "tiktoken>=0.5",
    "safetensors>=0.4",
    "einops>=0.7",
    "accelerate>=0.25",
    "verovio>=4.0",
]

[project.scripts]
ocr-studio = "src.main:main"
ocr-cli = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Default test runs ignore tests/benchmarks/ — those are slow and meant
# to be invoked explicitly with `pytest tests/benchmarks --benchmark-only`.
testpaths = ["tests/unit", "tests/integration"]
python_files = "test_*.py"
addopts = "-v --tb=short"
markers = [
    "benchmark: explicit performance benchmark (run via tests/benchmarks)",
    "exercise_preflight: test wants real external-tools check, not the autouse mock",
]
filterwarnings = [
    # Python 3.12+ warns about fork() in multithreaded processes.
    # Our progress-bridge tests create multiprocessing.Manager() inside
    # a pytest session that already has threads from PySide6/Qt. The
    # production code uses spawn on Windows (where it matters); on
    # Linux the fork is safe in practice because the forked child
    # immediately execs. Suppress the noise so CI stays clean.
    "ignore::DeprecationWarning:multiprocessing",
    # datetime.utcnow() — we've fixed our own code but some deps
    # (ocrmypdf, transformers) may still emit this.
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
